name: Frontend checks
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit
      - run: npm run typecheck
      - name: Build production app under /mro/
        run: npm run build
        env:
          VITE_BASE_PATH: /mro/
      - name: Verify production assets
        run: |
          grep -q '/mro/' dist/index.html
          test -s dist/fonts.css
